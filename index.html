<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たんぽぽ歯科マニュアル</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock-screen" class="lock-screen">
  <form id="lock-form" class="lock-form">
    <img class="site-logo" src="assets/logo.png" alt="たんぽぽ歯科ロゴ">
    <p>パスワードを入力してください</p>
    <input type="password" id="lock-password" placeholder="パスワード" autocomplete="off">
    <p id="lock-error" class="lock-error" hidden>パスワードが違います。</p>
    <button type="submit">入る</button>
  </form>
</div>

<div id="site-content" hidden>
<header class="site-header">
  <img class="site-logo" src="assets/logo.png" alt="たんぽぽ歯科ロゴ">
  <h1>たんぽぽ歯科マニュアル</h1>
  <div class="header-actions">
    <div class="header-actions-row">
      <a class="post-link" href="https://docs.google.com/forms/d/e/1FAIpQLSenAoklKjuOjuqcrCn4UgWpSXF5dpECI_UanevwykuufVN8_w/viewform" target="_blank" rel="noopener">＋ 投稿する</a>
      <a class="post-link report-link" href="https://docs.google.com/forms/d/e/1FAIpQLSd-FISAFZAFbNzn-xcIXYWBmDg3mW0gT9bZ6ZwtVpXHpKjM4Q/viewform" target="_blank" rel="noopener">修正を報告する</a>
      <a class="post-link report-link" href="https://notebooklm.google.com/notebook/8bf328df-5014-4f11-a431-e524c106b7fd" target="_blank" rel="noopener">AIに質問する</a>
    </div>
    <div class="header-actions-row">
      <a class="post-link report-link" href="#" id="rules-link">就業規則・ルール</a>

      <div class="header-menu">
        <button type="button" class="post-link report-link menu-trigger" data-menu="admin-menu">事務手続き・申請など ▾</button>
        <div class="dropdown-menu" id="admin-menu" hidden>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSdXgPf6KeEPnA95Ik9lAQU7Bdn2di7gDoJSWD6zLSgBm84DlQ/viewform" target="_blank" rel="noopener">当日欠勤申請フォーム</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSfEVsWygoumXtqbnt8Qpfr3ByrKroBWuZhMyS1D71t72wu3Ag/viewform" target="_blank" rel="noopener">残業申請フォーム</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSfLLHRnd_0Gw8TPRqH9lwgxnredSM1lezO6GtzCQbH7nrmzrA/viewform" target="_blank" rel="noopener">休暇申請フォーム(準備中)</a>
        </div>
      </div>

      <div class="header-menu">
        <button type="button" class="post-link report-link menu-trigger" data-menu="report-menu">日報・報告フォーム ▾</button>
        <div class="dropdown-menu" id="report-menu" hidden>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSehm5Shx1d6cDAf186FC6vTb3CCn4qlnpfk-_vBjfqDT7tiPA/viewform" target="_blank" rel="noopener">本院受付・医管日報</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSddiT3ApQ71jmJxPrQ3CQlNgFzXdyCXP8BViIEUkGG-srfFBg/viewform" target="_blank" rel="noopener">分院日報</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSc3RyyCOu6oRtQS00R-Wxq7uVIq9Q2AYfDEGaqsAFU4HQiHFg/viewform" target="_blank" rel="noopener">訪問日報</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSc2vxry9oMF8idbPhSw2Ll7cdsvMOcdhC6H3beRFOg7LHKnvg/viewform" target="_blank" rel="noopener">訪問初診患者共有フォーム</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSf3Lkm00XTpPZZH25P_H1YeFR2mX7x8Saia0E2szR9n3xvJXA/viewform" target="_blank" rel="noopener">訪問カンファレンスフォーム</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSd9oxdxK-YO6YK6fNXlLYTYyCmkcGBOMNuBxg0jbp1s14vR1w/viewform" target="_blank" rel="noopener">ケア日報・ケアユニット稼働表</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSeOPL1qVbaCjK2PfAhvXl8mofiMjiAOFEbv2RgOhvwWXMuo4Q/viewform" target="_blank" rel="noopener">保育士日報</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSfEdheBu86kW4rPdnbTkxlrf3q5feipgqfT-DoP25mdG1Vw8w/viewform" target="_blank" rel="noopener">スタッフ託児報告</a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSdMWJr8PGt8gMYW_IYp22BMd-jwN6RmmmvzYs9E3BEfUeJtdQ/viewform" target="_blank" rel="noopener">パート保育士日報</a>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="media-tabs" class="media-tabs" role="tablist" aria-label="動画・写真で絞り込み">
    <button type="button" class="media-tab" data-media="all">すべて</button>
    <button type="button" class="media-tab" data-media="video">動画</button>
    <button type="button" class="media-tab" data-media="photo">写真</button>
    <button type="button" class="media-tab" data-media="favorite">お気に入り</button>
  </div>

  <div class="controls">
    <input type="search" id="search-input" placeholder="タイトルや説明で検索..." aria-label="動画を検索">
    <select id="sort-select" aria-label="並び替え">
      <option value="new">投稿が新しい順</option>
      <option value="old">投稿が古い順</option>
      <option value="views-desc">再生数が多い順</option>
      <option value="views-asc">再生数が少ない順</option>
    </select>
    <div id="category-filters" class="category-filters" role="group" aria-label="カテゴリで絞り込み"></div>
  </div>

  <p id="empty-message" class="empty-message" hidden>該当する動画が見つかりませんでした。</p>

  <div id="video-grid" class="video-grid"></div>
</main>

<div id="video-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-content">
    <button type="button" class="modal-close" data-close aria-label="閉じる">&times;</button>
    <button type="button" id="modal-favorite-btn" class="modal-favorite-btn" aria-label="お気に入りに追加">♡</button>
    <div id="modal-video-wrap" class="modal-video-wrap">
      <iframe id="modal-iframe" src="" allow="autoplay" allowfullscreen></iframe>
    </div>
    <div id="modal-photo-wrap" class="modal-photo-wrap" hidden>
      <img id="modal-photo" src="" alt="">
      <button type="button" id="modal-photo-prev" class="modal-photo-nav modal-photo-prev" aria-label="前の写真">&#10094;</button>
      <button type="button" id="modal-photo-next" class="modal-photo-nav modal-photo-next" aria-label="次の写真">&#10095;</button>
      <span id="modal-photo-count" class="modal-photo-count"></span>
    </div>
    <div class="modal-text">
      <h2 id="modal-title"></h2>
      <p id="modal-description"></p>
    </div>
  </div>
</div>

<button type="button" id="chat-toggle" class="chat-toggle" aria-label="マニュアルに質問する">💬</button>
<div id="chat-panel" class="chat-panel" hidden>
  <div class="chat-header">
    <span>マニュアルに質問する</span>
    <button type="button" id="chat-close" aria-label="閉じる">&times;</button>
  </div>
  <div id="chat-messages" class="chat-messages">
    <div class="chat-message chat-message-bot">
      こんにちは！マニュアルの内容について質問してください。(例:「インカムの使い方は？」)
    </div>
  </div>
  <form id="chat-form" class="chat-form">
    <input type="text" id="chat-input" placeholder="質問を入力..." autocomplete="off">
    <button type="submit">送信</button>
  </form>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
